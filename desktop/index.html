<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile1X Desktop: everything we have built, one click away</title>
<meta name="description" content="Mobile1X's apps, platforms and tools laid out like desktop icons. Click one to run it.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace; --gold:#c89b3c; --ink:#f4f1ea; --mute:#a7a299; --line:rgb(255 255 255 / 10%); --panel:#141415; }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#08080a; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; }

/* splash */
.splash { position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:#050506; overflow:hidden; animation:splashOut .9s cubic-bezier(.7,0,.3,1) 2.3s forwards; }
.splash::before { content:""; position:absolute; width:90vmin; height:90vmin; border-radius:50%; background:radial-gradient(closest-side, rgb(200 155 60 / 30%), transparent); animation:glow 3.2s ease-out forwards; }
.sp-in { position:relative; display:flex; flex-direction:column; align-items:center; gap:2.4vh; animation:zoomIn 3.2s cubic-bezier(.16,.8,.3,1) forwards; }
.sp-mark { width:clamp(96px,16vmin,170px); height:auto; filter:drop-shadow(0 0 40px rgb(255 214 0 / 25%)); }
.sp-word { font-weight:600; font-size:clamp(1.6rem,4.4vmin,2.6rem); letter-spacing:-.03em; opacity:0; animation:fade .9s ease .5s forwards; }
.sp-word i { font-style:normal; color:#FFD600; }
.sp-tag { font-family:var(--mono); font-size:clamp(.65rem,1.5vmin,.85rem); letter-spacing:.28em; text-transform:uppercase; color:var(--mute); opacity:0; animation:fade .9s ease 1s forwards; }
@keyframes zoomIn { 0% { transform:scale(.55); opacity:0; filter:blur(10px); } 25% { opacity:1; filter:blur(0); } 70% { transform:scale(1); } 100% { transform:scale(1.25); } }
@keyframes glow { from { transform:scale(.3); opacity:0; } 50% { opacity:1; } to { transform:scale(1.4); opacity:.8; } }
@keyframes splashOut { to { opacity:0; transform:scale(1.6); visibility:hidden; } }
.splash.gone { display:none; }
body:not(.go) .hero *, body:not(.go) .ico, body:not(.go) .ico .tile { animation-play-state:paused !important; }

/* leave to main site */
body { transition:transform .7s cubic-bezier(.7,0,.3,1), opacity .7s ease; }
body.leaving { transform:scale(1.35); opacity:0; }
.enter { position:fixed; left:50%; bottom:2.4vh; transform:translateX(-50%); z-index:6; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--mono); font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); opacity:0; animation:fade 1s ease 3.4s forwards; cursor:pointer; background:none; border:0; }
.enter svg { width:18px; height:18px; stroke:var(--gold); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; animation:nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 50% { transform:translateY(5px); } }

/* wallpaper */
.wall { position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(900px 600px at 82% 12%, rgb(200 155 60 / 38%), transparent 60%),
    radial-gradient(800px 700px at 8% 95%, rgb(70 90 200 / 20%), transparent 60%),
    linear-gradient(160deg,#0d0d10,#08080a 60%); }
.wall::before { content:""; position:absolute; width:60vw; height:60vw; right:-10vw; top:-20vw; border-radius:50%; background:radial-gradient(closest-side, rgb(200 155 60 / 22%), transparent); animation:drift 18s ease-in-out infinite alternate; }
@keyframes drift { to { transform:translate(-12vw,10vh) scale(1.15); } }
.wall::after { content:""; position:absolute; inset:0; opacity:.35;
  background-image:radial-gradient(rgb(255 255 255 / 7%) 1px, transparent 1px); background-size:28px 28px; }
.mark { display:none; position:fixed; right:32px; bottom:28px; z-index:1; text-align:right; pointer-events:none; }
.mark b { display:block; font-size:clamp(2rem,5vw,3.6rem); font-weight:700; letter-spacing:-.03em; color:rgb(255 255 255 / 9%); }
.mark span { font-size:.8rem; color:rgb(255 255 255 / 30%); }

/* top bar */
.bar { position:fixed; top:0; left:0; right:0; height:34px; z-index:50; display:flex; align-items:center; gap:18px; padding:0 16px;
  font-size:.8rem; background:rgb(10 10 12 / 70%); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.bar strong { font-weight:600; letter-spacing:.01em; }
.bar .brandmark { display:flex; align-items:center; gap:8px; color:var(--ink); }
.bar .brandmark img { border-radius:6px; display:block; }
.bar a { color:var(--mute); text-decoration:none; }
.bar a:hover { color:var(--ink); }
.bar .sp { flex:1; }
.bar a, .bar time { font-family:var(--mono); }
.bar time { color:var(--mute); font-variant-numeric:tabular-nums; }

/* headline */
.hero { position:fixed; top:34px; left:0; right:0; height:27vh; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 6vw; pointer-events:none; }
.hero h1 { font-size:clamp(1.8rem,4.4vw,4rem); font-weight:600; letter-spacing:-.035em; line-height:1.08; }
.hero h1 .w { display:inline-block; opacity:0; transform:translateY(.5em); filter:blur(8px); animation:word .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(.15s + var(--i) * .09s); }
.hero h1 .gold { background:linear-gradient(100deg,#9a7425 10%,#f3dc9b 40%,#c89b3c 55%,#f3dc9b 70%,#9a7425 90%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:word .9s cubic-bezier(.2,.8,.2,1) forwards, shine 6s linear 1.8s infinite; animation-delay:calc(.15s + var(--i) * .09s), 1.8s; }
.hero p { font-family:var(--mono); margin-top:1.1vh; font-size:clamp(.85rem,1.2vw,1.05rem); color:var(--mute); letter-spacing:.02em; opacity:0; animation:fade 1s ease 1.6s forwards; }
.hero .rule { width:0; height:1px; margin-top:2.2vh; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:rule 1.4s cubic-bezier(.2,.8,.2,1) 1.2s forwards; }
@keyframes word { to { opacity:1; transform:none; filter:blur(0); } }
@keyframes fade { to { opacity:1; } }
@keyframes rule { to { width:min(420px,60vw); } }
@keyframes shine { to { background-position:-250% 0; } }

/* icons */
.icons { position:fixed; top:calc(34px + 27vh); left:0; right:0; bottom:0; z-index:2; padding:1vh 6vw 3vh; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:3vh 2vw; overflow:auto; }
.ico { all:unset; box-sizing:border-box; position:relative; width:clamp(150px,19vw,230px); display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px; border-radius:18px; cursor:pointer; text-align:center; transition:background .2s; }
.ico { opacity:0; animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(1.1s + var(--i) * .07s); }
@keyframes rise { from { opacity:0; transform:translateY(28px) scale(.92); } to { opacity:1; transform:none; } }
.ico .tile { animation:bob 7s ease-in-out infinite; animation-delay:calc(var(--i) * -.6s); }
@keyframes bob { 50% { translate:0 -5px; } }
.ico.hot .tile { animation:bob 7s ease-in-out infinite, pulse 3.6s ease-in-out infinite; animation-delay:calc(var(--i) * -.6s), 0s; }
@keyframes pulse { 50% { filter:drop-shadow(0 0 18px rgb(200 155 60 / 55%)); } }
.ico:hover { background:rgb(255 255 255 / 4%); }
.ico:hover .tile { transform:translateY(-6px) scale(1.07); box-shadow:0 26px 50px rgb(0 0 0 / 60%), 0 0 0 1.5px rgb(200 155 60 / 75%), 0 0 46px rgb(200 155 60 / 35%); }
.ico:hover .lbl { color:#f3dc9b; }
.lbl { transition:color .2s; }
.ico:focus-visible, .ico.sel { background:rgb(200 155 60 / 18%); outline:1px solid rgb(200 155 60 / 55%); }
.tile { position:relative; width:clamp(84px,min(12vh,8vw),130px); height:clamp(84px,min(12vh,8vw),130px); border-radius:24%; display:grid; place-items:center; flex:none; overflow:hidden; margin-bottom:8px;
  font-weight:700; color:#fff; transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; box-shadow:0 14px 32px rgb(0 0 0 / 50%), 0 0 0 1px rgb(255 255 255 / 10%); }
.tile::after { content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(120deg, transparent 35%, rgb(255 255 255 / 28%) 50%, transparent 65%); transform:translateX(-120%); transition:transform .6s ease; pointer-events:none; }
.ico:hover .tile::after { transform:translateX(120%); }
.tile img { width:100%; height:100%; object-fit:cover; display:block; }
.tile.mono { background:linear-gradient(160deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 2%)), #15151a; box-shadow:0 14px 32px rgb(0 0 0 / 50%), inset 0 0 0 1px rgb(200 155 60 / 35%), inset 0 1px 0 rgb(255 255 255 / 12%); }
.tile.mono b { font-weight:500; font-size:clamp(1.6rem,3vw,2.8rem); letter-spacing:-.02em; color:#e6c887; }
.cat { font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); opacity:.8; }
.lbl { font-size:clamp(.95rem,1.25vw,1.15rem); font-weight:500; letter-spacing:-.005em; max-width:100%; }
.ico.hot .tile { box-shadow:0 14px 32px rgb(0 0 0 / 50%), 0 0 0 1.5px rgb(200 155 60 / 70%), 0 0 30px rgb(200 155 60 / 25%); }
.ico.hot:hover .tile { box-shadow:0 26px 50px rgb(0 0 0 / 60%), 0 0 0 2px rgb(200 155 60 / 100%), 0 0 56px rgb(200 155 60 / 45%); }
.ico.hot .cat { color:var(--gold); opacity:1; }
.ico:active .tile { transform:scale(.94); }

/* highlight */
.hl { position:fixed; z-index:3; top:70px; right:36px; width:min(430px,34vw); display:flex; flex-direction:column; gap:14px; }
.hl .eyebrow { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600; display:flex; align-items:center; gap:8px; }
.hl .eyebrow::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 12px var(--gold); }
.hc { position:relative; display:flex; gap:16px; padding:18px; border-radius:20px; cursor:pointer; text-align:left; color:inherit; font:inherit;
  background:linear-gradient(150deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%)); border:1px solid rgb(200 155 60 / 40%); backdrop-filter:blur(18px);
  box-shadow:0 0 0 1px rgb(0 0 0 / 40%), 0 24px 60px rgb(0 0 0 / 50%), 0 0 60px rgb(200 155 60 / 16%); transition:transform .18s, box-shadow .18s; }
.hc:hover { transform:translateY(-3px); box-shadow:0 0 0 1px rgb(0 0 0 / 40%), 0 28px 70px rgb(0 0 0 / 55%), 0 0 80px rgb(200 155 60 / 30%); }
.hc .tile { width:88px; height:88px; border-radius:22px; }
.hc h3 { font-size:1.2rem; letter-spacing:-.01em; margin-bottom:2px; }
.hc p { font-size:.82rem; line-height:1.5; color:var(--mute); margin:6px 0 10px; }
.hc .go { font-size:.78rem; font-weight:600; color:var(--gold); }
.badge { display:inline-block; font-size:.66rem; font-weight:600; padding:2px 8px; border-radius:99px; background:rgb(200 155 60 / 18%); color:var(--gold); margin-left:6px; vertical-align:middle; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stats div { padding:12px; border-radius:14px; background:rgb(255 255 255 / 5%); border:1px solid var(--line); text-align:center; }
.stats b { display:block; font-size:1.5rem; letter-spacing:-.02em; }
.stats span { font-size:.7rem; color:var(--mute); }
@media (max-width:1100px) { .hl { display:none; } }


@media (max-width:700px) { .hero { height:24vh; } .icons { top:calc(34px + 24vh); }
  .ico { width:42vw; }
  .mark { display:none; }
}
@media (prefers-reduced-motion:reduce) { .splash { animation-delay:.6s; } body.leaving { transform:none; } *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; } .hero h1 .w, .hero p, .ico { opacity:1; transform:none; filter:none; } }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="sp-in">
    <svg class="sp-mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0A0A0A"/><rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="rgb(255 255 255 / 14%)"/><path d="M9.5 12.2 13 10.4V22" fill="none" stroke="#FFD600" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 14l6.5 8M23 14l-6.5 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div class="sp-word">Mobile<i>1</i>X</div>
    <div class="sp-tag">Build · Don’t talk</div>
  </div>
</div>
<link rel="prefetch" href="/">
<div class="wall"></div>

<header class="bar">
  <a class="brandmark" href="/" aria-label="Mobile1X"><img src="/assets/logo.svg" alt="" width="22" height="22"><strong>Mobile1X</strong></a>
  <a href="/">Main site</a>
  <a href="/services/mobile-app-development/">Services</a>
  <a href="/blog/">Guides</a>
  <a href="/about/">About</a>
  <a href="https://calendly.com/themobile1x/30min" target="_blank" rel="noopener">Book a call</a>
  <a href="mailto:hello@mobile1x.com">Contact</a>
  <span class="sp"></span>
  <time id="clock"></time>
</header>

<section class="hero" aria-label="Mobile1X">
  <h1 id="hh"></h1>
  <div class="rule"></div>
  <p>12 years of experience in Applications and AI Engineering · Eleven products built in a year · Click any icon to run it.</p>
</section>

<main class="icons" id="icons" aria-label="Mobile1X projects"></main>

<div class="mark"><b>Mobile1X</b><span>Built over the last year · click an icon to run it</span></div>

<button class="enter" id="enter" aria-label="Enter the Mobile1X website">Scroll to enter mobile1x.com<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>

<script>

/* name, url, embed (same-origin only), gradient, glyph, tags, blurb */
const APPS = [
  { n:'Notes', c:'Android · iOS', u:'/notes/', embed:true, img:'/assets/apps/notes/icon.webp', store:true, t:['Android','iOS','AI'],
    d:'Private, local-first notes app with voice recording and AI. On Google Play and the App Store.',
    links:[['Google Play','https://play.google.com/store/apps/details?id=com.rp.notes'],['App Store','https://apps.apple.com/us/app/notes-voice-record-ai/id6798175378']] },
  { n:'Dedup', c:'Android · iOS', u:'https://www.dedup.space', img:'/assets/apps/dedup/icon.webp', store:true, t:['Android','iOS','Utility'],
    d:'Duplicate file remover and storage cleaner for Android and iPhone.',
    links:[['Google Play','https://play.google.com/store/apps/details?id=com.rp.dedup'],['App Store','https://apps.apple.com/us/app/dedup-duplicate-photo-cleaner/id6814824281']] },
  { n:'Commerce by Mobile1X', c:'E-commerce', u:'https://thea2zcollection.com', img:'/assets/apps/commerce/icon.svg', t:['E-commerce','Web'],
    d:'Full-featured e-commerce web app, from browsing to checkout.' },
  { n:'POS System', c:'Billing', u:'https://a2zpos.netlify.app', img:'/assets/apps/pos/icon.svg', t:['Billing','Inventory'],
    d:'Point-of-sale software: fast billing, inventory and sales reporting.' },
  { n:'B2B Pharma', c:'Marketplace', u:'/pharma/', embed:true, img:'/assets/apps/pharma/icon.svg', t:['B2B','Marketplace'],
    d:'Connects pharmaceutical suppliers and buyers: catalogue, pricing, ordering.' },
  { n:'Auction Manager', c:'Real-time', u:'https://thempl.netlify.app/', img:'/assets/apps/auction/icon.svg', t:['Real-time','Web'],
    d:'Real-time command centre for IPL-style player auctions.' },
  { n:'BhashaSetu', c:'Learning', u:'/english/', embed:true, img:'/assets/apps/bhashasetu/icon.svg', t:['Hindi-first','Voice'],
    d:'Practise spoken English in Hindi: listen, repeat, answer by voice or writing, keep a daily streak.' },
  { n:'Mobile1X CRM', c:'CRM', u:'/crm/', img:'/assets/apps/crm/icon.svg', t:['CRM','Web'],
    d:'CRM for leads and clients, hosted at mobile1x.com/crm.' },
  { n:'Collab', c:'Tasks', u:'/Collab/', img:'/assets/apps/collab/icon.svg', t:['Tasks','Kanban'],
    d:'Task and kanban collaboration app with share links.' },
  { n:'Resto by Mobile1X', c:'Restaurant', u:'https://priffr.com', img:'/assets/apps/resto/icon.svg', t:['Restaurant','Web'],
    d:'Resto by Mobile1X, live at priffr.com.' },
  { n:'TakeMyTest', c:'Hiring', u:'/tmt/', embed:true, img:'/assets/apps/tmt/icon.svg', t:['Hiring','Assessments'],
    d:'Role-based hiring assessments.' },
];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tileHTML = a => a.img ? `<span class="tile"><img src="${a.img}" alt="" width="96" height="96"></span>` : `<span class="tile mono"><b>${esc(a.k)}</b></span>`;

const HEAD = [['They',0],['say',0],['build,',0],['don’t',0],['talk.',0],['<br>',2],['We',0],['built',0],['for',0],['a',0],['year',0],['and',0],['now',0],['our',0],['work',1],['does',1],['the',1],['talking.',1]];
$('#hh').innerHTML = HEAD.map(([w, k], i) => k === 2 ? '<br>' : `<span class="w${k === 1 ? ' gold' : ''}" style="--i:${i}">${w}</span>`).join(' ');
const icons = $('#icons');
APPS.forEach((a, i) => {
  const b = document.createElement('a');
  b.href = a.u;
  b.setAttribute('aria-label', a.n);
  b.style.setProperty('--i', i);
  b.className = 'ico' + (a.store ? ' hot' : '');
  b.innerHTML = tileHTML(a) + `<span class="lbl">${esc(a.n)}</span><span class="cat">${esc(a.c)}</span>`;
  /* plain click: go straight there with a short zoom; modified clicks keep native behaviour */
  b.addEventListener('click', e => {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault(); go(a.u);
  });
  icons.append(b);
});

/* splash then reveal; skipped when returning in the same session */
const splash = $('#splash');
const seen = sessionStorage.getItem('m1x-splash');
const reveal = () => { splash.classList.add('gone'); document.body.classList.add('go'); sessionStorage.setItem('m1x-splash', '1'); };
if (seen) { reveal(); } else { splash.addEventListener('animationend', e => { if (e.target === splash && e.animationName === 'splashOut') reveal(); }); setTimeout(reveal, 4000); }

/* scroll / swipe / key down leaves for the existing site */
let leaving = false, acc = 0, accT = 0, touchY = null;
function go(url) {
  if (leaving || !document.body.classList.contains('go')) return;
  leaving = true; document.body.classList.add('leaving');
  setTimeout(() => { location.href = url; }, 450);
}
const enterSite = () => go('/');
const iconsAtEnd = () => { const c = $('#icons'); return c.scrollHeight - c.scrollTop - c.clientHeight < 4; };
addEventListener('wheel', e => {
  if (e.deltaY <= 0 || !iconsAtEnd()) { acc = 0; return; }
  const now = Date.now(); if (now - accT > 400) acc = 0; accT = now;
  acc += e.deltaY; if (acc > 90) enterSite();
}, { passive: true });
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => { if (touchY !== null && touchY - e.touches[0].clientY > 70 && iconsAtEnd()) enterSite(); }, { passive: true });
addEventListener('keydown', e => { if (['ArrowDown', 'PageDown', ' '].includes(e.key) && iconsAtEnd()) { e.preventDefault(); enterSite(); } });
$('#enter').addEventListener('click', enterSite);
addEventListener('pageshow', e => { if (e.persisted) { leaving = false; document.body.classList.remove('leaving'); } });

const clock = $('#clock');
(function tick() { clock.textContent = new Date().toLocaleString([], { weekday:'short', hour:'2-digit', minute:'2-digit' }); setTimeout(tick, 30000); })();
</script>
</body>
</html>
